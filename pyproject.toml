[project]
name = "excel-data-reader"
version = "0.3.0"
description = "Deterministic discovery and extraction of tabular data from XLSX workbooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
excel-data-reader = "excel_data_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
    "ty>=0.0.70,<0.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
