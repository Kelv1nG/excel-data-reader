name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run --frozen ruff check src tests examples

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests examples

      - name: Type-check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest

      - name: Smoke-test CLI
        run: uv run --frozen excel-data-reader inspect examples/workbooks/native_table.xlsx --json

      - name: Build distributions
        run: uv build
